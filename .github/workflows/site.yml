name: Actualizar y publicar

on:
  push:
    branches-ignore: [gh-pages]
  schedule:
    - cron: "17 */6 * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    # En push solo se publica; los datos se refrescan por cron, a mano o cuando llega un reporte o un pedido de seguimiento.
    if: >-
      github.event_name != 'push' && (github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'reporte') || contains(github.event.issue.labels.*.name, 'seguir'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/test.mjs
      - name: Actualizar datos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE_RADAR_ISSUE: ${{ github.event_name == 'schedule' && '1' || '0' }}
          # Los avisos salen en las corridas programadas y manuales (no al abrir issues, para no duplicar).
          NOTIFY_UPDATES: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: node scripts/update.mjs
      - name: Commit de datos
        # También si una etapa del script falló: lo que sí se actualizó se guarda igual.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "portal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "datos: actualización automática $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:${{ github.ref_name }}

  deploy:
    needs: update
    # Solo se publica desde la rama por defecto, para que una rama de prueba no pise el sitio.
    if: always() && github.ref_name == github.event.repository.default_branch && (contains(fromJSON('["success","failure"]'), needs.update.result) || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - run: node scripts/test.mjs
      - name: Publicar en la rama gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir _site && cp -r index.html assets data _site/ && touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "portal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
